apiVersion: v1
kind: ServiceAccount
metadata:
  name: imds-tracker
  namespace: imds-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: imds-tracker
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: imds-tracker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: imds-tracker
subjects:
  - kind: ServiceAccount
    name: imds-tracker
    namespace: imds-system
