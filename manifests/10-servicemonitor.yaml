# Optional; requires Prometheus Operator. Adjust release label to your Prometheus selector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: imds-tracker
  namespace: imds-system
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: [imds-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: imds-tracker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
